spring.application.name=user-service
server.port=8083

eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:users;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=mysecretpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health

# Same value in every service. Override with JWT_SECRET outside this demo.
jwt.secret=${JWT_SECRET:dev-only-shared-hmac-secret-must-be-32b}
jwt.expiration-seconds=3600

# Created on startup when the username is not already present.
app.admin.username=admin
app.admin.password=admin12345
